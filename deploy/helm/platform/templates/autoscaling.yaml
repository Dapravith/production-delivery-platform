{{- range $name, $svc := dict "gateway" .Values.gateway "order" .Values.order }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: "{{ $name }}-service" }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: "{{ $name }}-service" }
  minReplicas: {{ $svc.replicas }}
  maxReplicas: 10
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
    scaleUp: { stabilizationWindowSeconds: 30 }
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: "{{ $name }}-service" }
spec: { minAvailable: 1, selector: { matchLabels: { app: "{{ $name }}-service" } } }
---
{{- end }}
