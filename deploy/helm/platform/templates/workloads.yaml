{{- range $name, $svc := dict "gateway" .Values.gateway "order" .Values.order }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-service
  labels: { app.kubernetes.io/name: "{{ $name }}-service", app.kubernetes.io/part-of: production-delivery-platform }
spec:
  replicas: {{ $svc.replicas }}
  minReadySeconds: 10
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector: { matchLabels: { app: "{{ $name }}-service" } }
  template:
    metadata: { labels: { app: "{{ $name }}-service" } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: "{{ $name }}-service" } }
      containers:
        - name: {{ $name }}-service
          image: "{{ $.Values.global.registry }}/{{ $svc.image }}:{{ $svc.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports: [{ name: http, containerPort: {{ $svc.port }} }]
          env:
            - { name: OIDC_ISSUER_URI, value: "{{ $.Values.config.oidcIssuerUri }}" }
            - { name: OIDC_JWK_SET_URI, value: "{{ $.Values.config.oidcJwkSetUri }}" }
            - { name: OIDC_AUDIENCE, value: "{{ $.Values.config.oidcAudience }}" }
            {{- if eq $name "gateway" }}
            - { name: REDIS_HOST, value: "{{ $.Values.config.redisHost }}" }
            - { name: ORDER_SERVICE_URL, value: "http://order-service:8081" }
            {{- else }}
            - { name: R2DBC_URL, value: "{{ $.Values.config.r2dbcUrl }}" }
            - { name: JDBC_URL, value: "{{ $.Values.config.jdbcUrl }}" }
            - { name: KAFKA_BOOTSTRAP_SERVERS, value: "{{ $.Values.config.kafkaBootstrapServers }}" }
            - { name: DB_APP_USER, valueFrom: { secretKeyRef: { name: "{{ $.Values.secrets.existingSecret }}", key: "{{ $.Values.secrets.appUsernameKey }}" } } }
            - { name: DB_APP_PASSWORD, valueFrom: { secretKeyRef: { name: "{{ $.Values.secrets.existingSecret }}", key: "{{ $.Values.secrets.appPasswordKey }}" } } }
            - { name: DB_APP_ROLE, value: "{{ $.Values.config.databaseAppRole }}" }
            - { name: DB_MIGRATOR_USER, valueFrom: { secretKeyRef: { name: "{{ $.Values.secrets.existingSecret }}", key: "{{ $.Values.secrets.migratorUsernameKey }}" } } }
            - { name: DB_MIGRATOR_PASSWORD, valueFrom: { secretKeyRef: { name: "{{ $.Values.secrets.existingSecret }}", key: "{{ $.Values.secrets.migratorPasswordKey }}" } } }
            {{- end }}
          resources:
            {{ toYaml $svc.resources | nindent 12 }}
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: http }, initialDelaySeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: http }, initialDelaySeconds: 30 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata: { name: "{{ $name }}-service", labels: { app: "{{ $name }}-service" } }
spec:
  selector: { app: "{{ $name }}-service" }
  ports: [{ name: http, port: {{ $svc.port }}, targetPort: http }]
---
{{- end }}
