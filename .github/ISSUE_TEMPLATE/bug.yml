name: Defect
description: Report a reproducible application, delivery, security, or operations defect.
title: "[BUG] "
labels: []
projects: []
assignees: []
body:
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [Local, Development, Staging, UAT, Production]
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Explain user, data, security, or delivery impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical - security, data integrity, or full outage
        - High - major workflow unavailable
        - Medium - degraded behavior with workaround
        - Low - minor defect
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence
      description: Remove tokens, passwords, personal data, and private endpoints.
      placeholder: Logs, screenshots, metrics, commit SHA, image digest, or Argo revision
  - type: checkboxes
    id: checks
    attributes:
      label: Reporter checks
      options:
        - label: I removed credentials and sensitive data from the report.
          required: true
        - label: I searched for an existing defect before creating this issue.
          required: true
