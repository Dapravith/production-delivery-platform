name: Verification

on:
  push:
    branches:
      - "feat/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-and-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Configure Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Record tool versions
        run: |
          java -version
          mvn --version
          docker --version
          docker compose version
          helm version --short

      - name: Run unit and manifest verification
        run: ./scripts/verify.sh

      - name: Run authenticated runtime smoke test
        run: ./scripts/smoke-test.sh
